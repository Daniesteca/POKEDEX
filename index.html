<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeDex</title>
     <!-- Favicon -->
    <link rel="icon" href="./img/pokemon.png" type="image/png">
    <!-- Estilos -->
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    
<header>
  <nav class="nav">
    <img src="./img/logo.png" alt="Logo Pokédex">

    <label for="typeFilter" class="filter-label">Filtrar tipo de Pokémon:</label>
    <select id="typeFilter" class="filter-select">
      <option value="ver-todos">Ver todos</option>
      <option value="normal">Normal</option>
      <option value="fire">Fire</option>
      <option value="water">Water</option>
      <option value="grass">Grass</option>
      <option value="electric">Electric</option>
      <option value="ice">Ice</option>
      <option value="fighting">Fighting</option>
      <option value="poison">Poison</option>
      <option value="ground">Ground</option>
      <option value="flying">Flying</option>
      <option value="psychic">Psychic</option>
      <option value="bug">Bug</option>
      <option value="rock">Rock</option>
      <option value="ghost">Ghost</option>
      <option value="dark">Dark</option>
      <option value="dragon">Dragon</option>
      <option value="steel">Steel</option>
      <option value="fairy">Fairy</option>
    </select>
    
    <button id="toggleTheme" class="theme-btn">Modo Claro</button>
  </nav>
</header>



<!-- cards pokemon -->
<main>
    <div id="todos">
        <div class="pokemon-todos" id="listaPokemon">
<!-- catras de los pokemon construida en js -->
        </div>
    </div>
</main>

<!-- 🔥 POPUP POKÉMON -->
<div id="pokemonPopup" class="popup-container hidden">

<!-- Flecha izquierda -->
<button id="prevPokemon" class="nav-btn nav-left">
<img src="./img/flecha-izquierda.png" alt="Prev">
</button>

  <div class="popup-card">

    <button id="closePopup" class="close-btn">X</button>
    <div class="popup-header">
        <img id="popupImg" src="" alt="pokemon image">
        <h2 id="popupName"></h2>
    </div>

    <!-- 🔹 Altura y Peso -->
    <div class="meta-row">
    <p id="popupId"></p>
    <div id="popupTypes" class="types"></div>
    <p><strong>Altura:</strong> <span id="popupHeight"></span> M</p>
    <p><strong>Peso:</strong> <span id="popupWeight"></span> KG</p>
    </div>

    <!-- 🔹 Stats -->
    <div class="stats-section">
    <strong>Estadísticas base:</strong>
    <div id="statsContainer" class="stats-container"></div>
    </div>

    <!-- 🔹 Debilidades -->
    <div class="weakness-section">
    <strong>Debilidades:</strong>
    <div id="weaknessContainer" class="weaknesses"></div>
    </div>

    <!-- 🔹 Evoluciones -->
    <div class="evolution-section">
    <strong>Evoluciones:</strong>
    <div id="evolutionContainer" class="evolutions"></div>
    </div>

  </div>

<!-- Flecha derecha -->
<button id="nextPokemon" class="nav-btn nav-right">
<img src="./img/flecha-correcta.png" alt="Next">
</button>
  
</div>




<script src="./js/main.js" ></script>
</body>
</html>
